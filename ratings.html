<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>MovieMate - Ratings</title>
    <link rel="stylesheet" href="styles.css">
    <link rel="stylesheet" href="main.css">
    <link rel="stylesheet" href="ratings.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
</head>
<body>
    <button class="theme-toggle">
        <i class="fas fa-moon"></i>
        <span>Dark Mode</span>
    </button>
    <div class="dashboard-container">
        <!-- Sidebar -->
        <aside class="sidebar">
            <div class="sidebar-header">
                <img src="../genres/moviemate.jpg" alt="MovieMate Logo">
                <h2>MovieMate</h2>
            </div>
            <nav class="sidebar-nav">
                <ul>
                    <li>
                        <a href="main.html">
                            <i class="fas fa-home"></i>
                            <span>Dashboard</span>
                        </a>
                    </li>
                    <li>
                        <a href="genres.html">
                            <i class="fas fa-film"></i>
                            <span>Genres</span>
                        </a>
                    </li>
                    <li>
                        <a href="watchlist.html">
                            <i class="fas fa-heart"></i>
                            <span>Watchlist</span>
                        </a>
                    </li>
                    <li class="active">
                        <a href="ratings.html">
                            <i class="fas fa-star"></i>
                            <span>Ratings</span>
                        </a>
                    </li>
                    <li>
                        <a href="recommendations.html">
                            <i class="fas fa-users"></i>
                            <span>Recommendations</span>
                        </a>
                    </li>
                </ul>
            </nav>
            <div class="sidebar-footer">
                <button class="logout-btn" onclick="logout()">
                    <i class="fas fa-sign-out-alt"></i>
                    <span>Logout</span>
                </button>
            </div>
        </aside>

        <!-- Main Content -->
        <main class="main-content">
            <!-- Top Bar -->
            <header class="top-bar">
                <div class="search-container">
                    <input type="text" placeholder="Search in ratings..." class="search-input">
                    <button class="search-btn">
                        <i class="fas fa-search"></i>
                    </button>
                </div>
                <div class="user-info">
                    <div class="admin-indicator">
                        <i class="fas fa-user-shield"></i>
                        <span>Admin</span>
                    </div>
                    <div class="notifications">
                        <i class="fas fa-bell"></i>
                        <span class="notification-badge">3</span>
                    </div>
                </div>
            </header>

            <!-- Ratings Content -->
            <div class="ratings-content">
                <div class="section-header">
                    <h1>My Ratings</h1>
                    <div class="ratings-filters">
                        <button class="filter-btn active">All</button>
                        <button class="filter-btn">Highest Rated</button>
                        <button class="filter-btn">Recently Rated</button>
                        <button class="filter-btn">By Genre</button>
                    </div>
                </div>

                <div class="ratings-stats">
                    <div class="stat-card">
                        <div class="stat-icon">
                            <i class="fas fa-star"></i>
                        </div>
                        <div class="stat-info">
                            <h3>Average Rating</h3>
                            <div class="stat-value">7.8</div>
                        </div>
                    </div>
                    <div class="stat-card">
                        <div class="stat-icon">
                            <i class="fas fa-film"></i>
                        </div>
                        <div class="stat-info">
                            <h3>Total Rated</h3>
                            <div class="stat-value">156</div>
                        </div>
                    </div>
                    <div class="stat-card">
                        <div class="stat-icon">
                            <i class="fas fa-heart"></i>
                        </div>
                        <div class="stat-info">
                            <h3>Favorite Genre</h3>
                            <div class="stat-value">Action</div>
                        </div>
                    </div>
                </div>

                <div class="ratings-grid">
                    <!-- Ratings items will be dynamically added here -->
                    <div class="empty-state">
                        <i class="fas fa-star"></i>
                        <h2>No ratings yet</h2>
                        <p>Start rating movies to see them here</p>
                        <button class="browse-btn">Browse Movies</button>
                    </div>
                </div>
            </div>
        </main>
    </div>

    <script src="ratings.js"></script>
    <script src="theme.js"></script>
</body>
</html>
